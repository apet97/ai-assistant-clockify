# The same gate the repo runs locally before every commit: type-check + the
# full vitest suite (fakes only — no network, no live creds) + the prod build,
# plus the zero-circular-deps invariant. Node 22 = prod parity (package.json
# engines / Railway).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail on a HIGH/CRITICAL advisory in the shipped (runtime) deps. Dev-only
      # tooling is excluded; Dependabot PRs handle lower-severity transitive bumps.
      - run: npm audit --omit=dev --audit-level=high
      # `npm run verify` now runs the cycles check (madge) itself, so no
      # separate cycles step is needed — the local gate equals the CI gate.
      - run: npm run verify
