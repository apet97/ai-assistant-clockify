# The same gate the repo runs locally before every commit: type-check + the
# full vitest suite (fakes only — no network, no live creds) + the prod build,
# plus the zero-circular-deps invariant. Node 22 = prod parity (package.json
# engines / Railway).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Surface a HIGH/CRITICAL advisory in the shipped (runtime) deps WITHOUT
      # hard-failing CI on a fresh upstream advisory unrelated to the PR (it still
      # shows in the log; Dependabot PRs handle the lower-severity transitive bumps).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      # `npm run verify` now runs the cycles check (madge) itself, so no
      # separate cycles step is needed — the local gate equals the CI gate.
      - run: npm run verify
      # Type-check the scripts/ + tests/helpers (not in the src tsconfig) so a tsc
      # error in an eval/live script can't ship silently.
      - run: npm run type-check:scripts
