# The same gate the repo runs locally before every commit: type-check + the
# full vitest suite (fakes only — no network, no live creds) + the prod build,
# plus the zero-circular-deps invariant. Node 22 = prod parity (package.json
# engines / Railway).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit policy
        run: npm run audit:prod
      - name: Production license policy and report
        run: npm run license:prod
      # `npm run verify` now runs the cycles check (madge) itself, so no
      # separate cycles step is needed — the local gate equals the CI gate.
      - run: npm run verify
      - name: Install Chromium for the local UI performance gate
        run: npx playwright install --with-deps chromium
      - name: Exact-head local UI and asset performance gate
        env:
          PERF_EVIDENCE_DIR: /tmp/ai-assistant-local-ui-performance
        run: npm run perf:local-ui
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: 1.7.7
      # The two steps below bind their evidence to the FROZEN v1 release
      # candidate and require every change since it to be evidence-only. They are
      # structurally inapplicable to a build that is not that candidate -- a v2
      # rewrite changes hundreds of executable files by definition -- so as
      # unconditional steps they blocked every branch, `main` included. This probe
      # decides applicability only; when it reports `true` both gates run below
      # completely unchanged and enforce their own full checks. It exits nonzero
      # rather than reporting `false` on any error, so a broken probe fails CI
      # instead of silently skipping the gates it guards.
      - name: Detect whether this build is the frozen v1 release candidate
        id: v1-candidate
        run: |
          set -euo pipefail
          IS_V1_CANDIDATE="$(npm run --silent evidence:v1-candidate-build)"
          if [ "$IS_V1_CANDIDATE" != "true" ] && [ "$IS_V1_CANDIDATE" != "false" ]; then
            echo "v1 candidate probe returned an unrecognized value: $IS_V1_CANDIDATE" >&2
            exit 1
          fi
          echo "is_v1_candidate=$IS_V1_CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Bind reviewed Marketplace media to the exact source candidate
        if: steps.v1-candidate.outputs.is_v1_candidate == 'true'
        env:
          MARKETPLACE_MEDIA_EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          MARKETPLACE_MEDIA_BINDING_PATH: /tmp/marketplace-media-release-binding.json
        run: |
          MARKETPLACE_MEDIA_SOURCE_CANDIDATE_SHA="$(node -e '
            const binding = require("./evidence/performance/deepseek-release-binding.json");
            process.stdout.write(binding.candidate.testedSha);
          ')"
          export MARKETPLACE_MEDIA_SOURCE_CANDIDATE_SHA
          npm run evidence:marketplace-media-binding
      - name: Validate machine-bound DeepSeek benchmark evidence
        if: steps.v1-candidate.outputs.is_v1_candidate == 'true'
        env:
          DEEPSEEK_EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          DEEPSEEK_VALIDATION_PATH: /tmp/deepseek-benchmark-validation.json
        run: npm run check:deepseek-evidence -- --benchmark-only
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence
          path: |
            sbom.cdx.json
            evidence/dependency-gates/production-licenses.json
            /tmp/deepseek-benchmark-validation.json
            /tmp/marketplace-media-release-binding.json
          retention-days: 30

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser product journeys
        run: npm run test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
