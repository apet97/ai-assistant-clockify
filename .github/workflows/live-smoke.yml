# Scheduled/manual live smoke against a sacrificial Clockify workspace. The
# named environment owns the two LIVE_* secrets and any operator protections.
name: Live smoke (sacrificial)

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: clockify-live-smoke-sacrificial
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: clockify-live-smoke-sacrificial
    env:
      LIVE_SMOKE_EVIDENCE_PATH: /tmp/ai-assistant-live-smoke-evidence/smoke.json
    steps:
      - name: Initialize fail-closed smoke evidence
        shell: bash
        run: |
          mkdir -p /tmp/ai-assistant-live-smoke-evidence
          printf '%s\n' '{"resourcePrefixes":["AIASSIST_SMOKE_"],"counts":{"failures":1},"status":"failed"}' > "${LIVE_SMOKE_EVIDENCE_PATH}"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live smoke
        run: timeout --signal=TERM --kill-after=30s 12m npx tsx scripts/live-smoke.ts
        env:
          LIVE_CLOCKIFY: "1"
          LIVE_CLOCKIFY_API_KEY: ${{ secrets.LIVE_CLOCKIFY_API_KEY }}
          LIVE_WORKSPACE_ID: ${{ secrets.LIVE_WORKSPACE_ID }}
      - name: Upload live-smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-smoke-evidence-${{ github.run_id }}
          path: /tmp/ai-assistant-live-smoke-evidence/smoke.json
          if-no-files-found: error
          retention-days: 30

  cleanup:
    needs: smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: clockify-live-smoke-sacrificial
    env:
      LIVE_SWEEP_EVIDENCE_PATH: /tmp/ai-assistant-live-smoke-evidence/cleanup.json
    steps:
      - name: Initialize fail-closed cleanup evidence
        shell: bash
        run: |
          mkdir -p /tmp/ai-assistant-live-smoke-evidence
          printf '%s\n' '{"resourcePrefixes":["AIASSIST_SMOKE_","AIASSIST_V2_"],"counts":{"failures":1},"status":"failed"}' > "${LIVE_SWEEP_EVIDENCE_PATH}"
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stays a direct `npx tsx` invocation: `workflow-contracts.test.ts` pins
      # this exact command so the `timeout --signal=TERM` wrapper signals the
      # sweep process itself rather than an npm wrapper. The same script now
      # sweeps BOTH the v1 smoke prefix and the T17-F v2 acceptance prefix.
      - name: Sweep leftovers
        run: timeout --signal=TERM --kill-after=30s 7m npx tsx scripts/live-sweep.ts
        env:
          LIVE_CLOCKIFY: "1"
          LIVE_CLOCKIFY_API_KEY: ${{ secrets.LIVE_CLOCKIFY_API_KEY }}
          LIVE_WORKSPACE_ID: ${{ secrets.LIVE_WORKSPACE_ID }}
      - name: Upload cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-smoke-cleanup-evidence-${{ github.run_id }}
          path: /tmp/ai-assistant-live-smoke-evidence/cleanup.json
          if-no-files-found: error
          retention-days: 30
