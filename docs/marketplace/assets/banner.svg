<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Assistant for Clockify marketplace banner</title>
  <desc id="desc">An admin request moves through a preview and button confirmation into a truthful Clockify receipt.</desc>
  <defs>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1290 84) rotate(137) scale(980 720)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2e6de0" stop-opacity=".38"/>
      <stop offset=".63" stop-color="#0e1116" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="746" y1="450" x2="1436" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b9bff"/>
      <stop offset=".72" stop-color="#3fce8b"/>
      <stop offset="1" stop-color="#3fce8b" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0e1116"/>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <path d="M0 772h1600" stroke="#2a313d" stroke-width="2"/>
  <path d="M88 112h1424" stroke="#2a313d" stroke-width="2"/>

  <g transform="translate(100 154)">
    <rect width="78" height="78" rx="22" fill="#171b23" stroke="#39424f" stroke-width="2"/>
    <path d="M20 23c0-7 6-12 12-12h29c7 0 12 5 12 12v22c0 7-5 12-12 12H47L31 70c-4 3-9 0-9-4v-9c-1-2-2-5-2-8V23Z" fill="#5b9bff"/>
    <path d="M33 31h27M33 42h18" stroke="#f7f9fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="65" cy="62" r="12" fill="#171b23" stroke="#3fce8b" stroke-width="3"/>
    <path d="m59 62 4 4 8-9" fill="none" stroke="#3fce8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="100" y="286" fill="#e9edf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="720" letter-spacing="-2">AI Assistant</text>
  <text x="100" y="348" fill="#a7b0bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="500">for Clockify admins</text>
  <text x="100" y="466" fill="#e9edf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="650">Ask. Preview. Confirm.</text>
  <text x="100" y="524" fill="#a7b0bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Fast answers. Bounded actions. Truthful receipts.</text>
  <g transform="translate(100 596)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">
    <rect width="174" height="42" rx="21" fill="#171b23" stroke="#39424f"/>
    <circle cx="24" cy="21" r="5" fill="#3fce8b"/>
    <text x="40" y="27" fill="#a7b0bf">ADMIN ONLY</text>
    <rect x="190" width="202" height="42" rx="21" fill="#171b23" stroke="#39424f"/>
    <circle cx="214" cy="21" r="5" fill="#5b9bff"/>
    <text x="230" y="27" fill="#a7b0bf">BUTTON CONFIRM</text>
  </g>

  <g transform="translate(742 178)" filter="url(#cardShadow)">
    <rect width="744" height="540" rx="30" fill="#171b23" stroke="#39424f" stroke-width="2"/>
    <path d="M0 76h744" stroke="#2a313d" stroke-width="2"/>
    <circle cx="34" cy="38" r="6" fill="#79828f"/>
    <circle cx="56" cy="38" r="6" fill="#79828f" opacity=".64"/>
    <text x="92" y="47" fill="#a7b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ADMIN ACTION CONSOLE</text>

    <g transform="translate(42 111)">
      <rect width="512" height="74" rx="18" fill="#1e242f" stroke="#2a313d"/>
      <text x="25" y="31" fill="#a7b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">REQUEST</text>
      <text x="25" y="56" fill="#e9edf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Archive the completed launch project.</text>
    </g>

    <path d="M82 222h546" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="82" cy="222" r="9" fill="#5b9bff"/>
    <circle cx="356" cy="222" r="9" fill="#f3b73f"/>
    <circle cx="628" cy="222" r="9" fill="#3fce8b"/>
    <text x="58" y="253" fill="#a7b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ASK</text>
    <text x="321" y="253" fill="#a7b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">PREVIEW</text>
    <text x="587" y="253" fill="#a7b0bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">RECEIPT</text>

    <g transform="translate(42 286)">
      <rect width="660" height="188" rx="18" fill="#0a0d12" stroke="#f3b73f" stroke-opacity=".7"/>
      <text x="24" y="31" fill="#f3b73f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">PREVIEW · EXISTING DATA WILL CHANGE</text>
      <text x="24" y="68" fill="#e9edf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="650">Archive “Launch 1.0”</text>
      <text x="24" y="99" fill="#a7b0bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">No mutation runs until the exact stored preview is confirmed.</text>
      <rect x="24" y="126" width="174" height="42" rx="10" fill="#2e6de0"/>
      <text x="50" y="153" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Confirm archive</text>
      <rect x="212" y="126" width="104" height="42" rx="10" fill="#1e242f" stroke="#39424f"/>
      <text x="237" y="153" fill="#a7b0bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650">Cancel</text>
      <circle cx="620" cy="147" r="18" fill="#171b23" stroke="#3fce8b" stroke-width="3"/>
      <path d="m611 147 6 6 13-15" fill="none" stroke="#3fce8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="100" y="834" fill="#79828f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v2.0.0 · 127 REVIEWED API ACTIONS · ADMIN CONTROLLED</text>
</svg>
