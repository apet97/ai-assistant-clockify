title = "AI Assistant Gitleaks policy"

[extend]
useDefault = true

# These AND-scoped exceptions cover only the historical, documented
# placeholders and fixed unit-test values that Gitleaks 8.24.3 classifies as the
# generic-api-key rule. Default rules remain active for every other line/path.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Documented encryption-key placeholders"
condition = "AND"
regexTarget = "line"
paths = ['''^\.env\.example$''']
regexes = ['''^\n?(# DATA_ENCRYPTION_KEY_PREVIOUS=replace-with-the-previous-secret-min-32-chars|DATA_ENCRYPTION_KEY=replace-with-64-hex-chars|DATA_ENCRYPTION_KEY=replace-with-a-strong-secret-min-32-chars)$''']

[[rules.allowlists]]
description = "Fixed encryption-key unit-test fixtures"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/unit/config\.test\.ts$''']
regexes = ['''DATA_ENCRYPTION_KEY(_PREVIOUS)?: "(0123456789abcdef0123456789abcdef|fedcba9876543210fedcba9876543210)"''']

[[rules.allowlists]]
description = "Generated API action catalog digest"
condition = "AND"
regexTarget = "line"
paths = ['''^src/harness/api-catalog\.generated\.ts$''']
regexes = ['''^\n?export const API_ACTION_CATALOG_HASH = "[0-9a-f]{64}" as const;$''']

[[rules.allowlists]]
description = "Fail-closed secret-detector negative test inputs"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/scripts/test_codex_v2_supervisor\.py$''']
regexes = ['''^\n?\s*"password: abcdefghijklmnop123",$''']

# The build-history prose ONCE quoted the supervisor's fake negative-test input
# verbatim; the current tree describes it without the literal, but the quoted
# line survives in immutable history blobs (CLAUDE.md before the log moved,
# docs/V2_BUILD_LOG.md at the move commit). Scoped to that ONE exact sentence
# in those two paths only — any other credential-shaped line in either file is
# still reported (proven adversarially with a planted key).
[[rules.allowlists]]
description = "Historical prose quoting the supervisor's fake negative-test input"
condition = "AND"
regexTarget = "line"
paths = ['''^CLAUDE\.md$''', '''^docs/V2_BUILD_LOG\.md$''']
regexes = ['''^\n?  `"password: abcdefghijklmnop123"` \(a NEGATIVE test input the supervisor's own detector is asserted$''']

[[rules.allowlists]]
description = "Historical workflow-contract assertions"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/unit/workflow-contracts\.test\.ts$''']
regexes = ['''^\n?    expect\(config\)\.toContain\("(DATA_ENCRYPTION_KEY=replace-with-64-hex-chars|DATA_ENCRYPTION_KEY=replace-with-a-strong-secret-min-32-chars)"\);$''']
